# PartKeeper 生产环境 nginx 站点配置（参考 101.91.202.217 实际部署）
#
# 端口分配（同机还有 personal-agent-platform，务必不要串用）：
#   80    → personal-agent-platform 的 default_server（Basic Auth 网关）
#   8080  → 已划给 pap 使用，PartKeeper 不得占用
#   8090  → PartKeeper Web（本文件）
#   8100  → gunicorn（仅 127.0.0.1）
#   8200  → MCP Server（仅 127.0.0.1，经本文件的 /mcp 反代暴露）
#   3306/3307/5432/5672/6379/8765/15672 等 → 其它既有服务
#
# 安装：
#   cp deploy/nginx-partkeeper.conf /etc/nginx/sites-available/partkeeper
#   ln -s ../sites-available/partkeeper /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /opt/partkeeper/frontend/dist;
    index index.html;

    # 与后端 MAX_CONTENT_LENGTH（12MB）对齐；小于后端会在 Nginx 先拦成 413
    client_max_body_size 12m;

    access_log /var/log/nginx/partkeeper.access.log;
    error_log  /var/log/nginx/partkeeper.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 带内容哈希的构建产物，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # MCP Streamable HTTP：必须关缓冲，否则 SSE 响应会被 Nginx 攒住
    location /mcp {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 兜底：非 API 路径统一回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
